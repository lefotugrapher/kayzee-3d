name: Test report
description: Tried Kayzee 3D? Tell us what worked and what broke.
labels: ["test report"]
body:
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows 10, Windows 11, macOS (Apple Silicon), macOS (Intel), Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kayzee 3D version
      description: Help > About, or the release you downloaded
      placeholder: "0.6.0"
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      placeholder: "e.g. Intel UHD 620, Nvidia RTX 3060, Apple M2"
  - type: dropdown
    id: start
    attributes:
      label: Did the window open?
      options: ["Yes", "Blank or black window", "Crashed or closed at once", "Did not start"]
  - type: dropdown
    id: unlock
    attributes:
      label: Did adding your disc image unlock rendering?
      options: ["Yes", "No (error shown)", "Did not try"]
  - type: textarea
    id: broke
    attributes:
      label: What broke, and how to make it happen again
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or rendered pictures
      description: Drag images here
